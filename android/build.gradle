allprojects {
    repositories {
        google()
        mavenCentral()
    }
    ext {
        flutter = [
            compileSdkVersion: 34,
            minSdkVersion: 24,
            targetSdkVersion: 34
        ]
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.plugins.withId("com.android.library") {
        if (project.android.extensions.findByName("flutter") == null) {
            project.android.extensions.add("flutter", [
                compileSdkVersion: 34,
                minSdkVersion: 24,
                targetSdkVersion: 34
            ])
        }
        project.android {
            compileSdkVersion 34
        }
    }
    project.plugins.withId("com.android.application") {
        if (project.android.extensions.findByName("flutter") == null) {
            project.android.extensions.add("flutter", [
                compileSdkVersion: 34,
                minSdkVersion: 24,
                targetSdkVersion: 34
            ])
        }
        project.android {
            compileSdkVersion 34
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
