name: personal_ai_language_coach
description: "Personal AI Language Coach - Học Tiếng Anh, Tiếng Nhật, Tiếng Trung trên Android"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Backend & Network
  supabase_flutter: ^2.5.0
  http: ^1.2.1
  dio: ^5.4.3+1

  # Audio & Voice Processing for Android
  just_audio: ^0.9.38
  audio_session: ^0.1.19
  record: ^5.1.2
  flutter_tts: ^4.0.2

  # Local Persistence & Storage
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # UI, Icons, Typography
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  percent_indicator: ^4.2.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - prompts/prompt_registry.json
